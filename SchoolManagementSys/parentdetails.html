<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent id Login Page</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<header>
    <img src="schoollogo.jpg" alt="logo">
    <h1><u><b>SCHOOL NAME GOES HERE</b></u></h1><hr>
</header>
<body>
    <fieldset>
        <legend>REGISTRATION DETAILS:</legend>
        <p id="stdname">Student name: </p>
        <p id="stdreg">Student regno: </p>
        <p id="stdroll">Student rollno: </p><hr>
        <p id="pntname">Parent name: </p>
        <p id="pntpno">Parent contact no: </p>
        <p id="pntrel">Parent relation to student: </p>
        <p id="pntocc">Parent occupation: </p>
    </fieldset><br>
    <input type="button" value="Back To Login" name="backtologin" id="backtologin" style="width: 120px; height: 30px; border-radius: 10px; border: 1px">
    <p id="mousevent">Student name appears here when you bring cursor here....</p>
    <button id="doubleclick" style="width: 120px; height: 30px; border-radius: 10px; border: 1px">Double click me!</button>
    <p>Click in the text box to focus: <input type="text" id="focusblur" style="width: 300px; height:30px;border-radius:5px; border: 1px; background-color:aquamarine;" placeholder="Click here!"></p>
</body>
<script src="parentdetailsjquery.js" defer></script>
</html>
